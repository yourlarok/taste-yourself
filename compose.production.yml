services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_PATH: /data/taste-yourself.db
      MEDIA_ROOT: /data/media
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      WECHAT_APP_ID: ${WECHAT_APP_ID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET}
      TRYON_PROVIDER: ${TRYON_PROVIDER}
      FASHN_API_BASE_URL: ${FASHN_API_BASE_URL:-https://api.fashn.ai/v1}
      FASHN_API_KEY: ${FASHN_API_KEY:-}
      FASHN_WORKER_URL: http://fashn-worker:9000
      FASHN_WORKER_TOKEN: ${FASHN_WORKER_TOKEN}
      STATIC_DAILY_LIMIT: ${STATIC_DAILY_LIMIT:-20}
      REALTIME_DAILY_LIMIT: ${REALTIME_DAILY_LIMIT:-3}
      PERSON_IMAGE_RETENTION_DAYS: ${PERSON_IMAGE_RETENTION_DAYS:-7}
      TRYON_RESULT_RETENTION_DAYS: ${TRYON_RESULT_RETENTION_DAYS:-30}
      REALTIME_PROVIDER: ${REALTIME_PROVIDER}
      DECART_API_KEY: ${DECART_API_KEY}
      REALTIME_WEB_ORIGIN: ${REALTIME_WEB_ORIGIN:-https://tryon.xuefeitryon.com}
      BODY_SCAN_PROVIDER: ${BODY_SCAN_PROVIDER}
      BODYGRAM_ORG_ID: ${BODYGRAM_ORG_ID:-}
      BODYGRAM_API_KEY: ${BODYGRAM_API_KEY:-}
      BODY_SCAN_WORKER_URL: ${BODY_SCAN_WORKER_URL:-}
      MIRROR_LLM_BASE_URL: ${MIRROR_LLM_BASE_URL}
      MIRROR_LLM_API_KEY: ${MIRROR_LLM_API_KEY}
      MIRROR_LLM_MODEL: ${MIRROR_LLM_MODEL}
      MIRROR_VISION_MODEL: ${MIRROR_VISION_MODEL}
      MIRROR_ASR_MODEL: ${MIRROR_ASR_MODEL:-qwen3-asr-flash}
      TAOBAO_APP_KEY: ${TAOBAO_APP_KEY}
      TAOBAO_APP_SECRET: ${TAOBAO_APP_SECRET}
      TAOBAO_SESSION: ${TAOBAO_SESSION:-}
      TAOBAO_ITEM_API_METHOD: ${TAOBAO_ITEM_API_METHOD:-taobao.tbk.item.info.get}
      BODY_SCAN_WORKER_TOKEN: ${BODY_SCAN_WORKER_TOKEN}
      CONTENT_SAFETY_PROVIDER: ${CONTENT_SAFETY_PROVIDER}
      CONTENT_SAFETY_URL: ${CONTENT_SAFETY_URL}
      CONTENT_SAFETY_TOKEN: ${CONTENT_SAFETY_TOKEN}
    volumes:
      - app-data:/data
      - app-backups:/backups
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    networks:
      - private

  fashn-worker:
    profiles: ["gpu"]
    build:
      context: ./workers/fashn_vton
    restart: unless-stopped
    environment:
      FASHN_WEIGHTS_DIR: /weights
      FASHN_OUTPUT_DIR: /outputs
      FASHN_WORKER_TOKEN: ${FASHN_WORKER_TOKEN}
    volumes:
      - ${FASHN_WEIGHTS_HOST_PATH}:/weights:ro
      - worker-output:/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - private

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - private

volumes:
  app-data:
  app-backups:
  worker-output:
  caddy-data:
  caddy-config:

networks:
  private:
